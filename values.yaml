kubernetesClusterDomain: cluster.local

nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/metrico/gigapipe
  tag: "v4.1.6"

# imagePullSecrets: 
#   nameOverride: ""

imageCredentials: {}
#   registry: registry.cluster.local
#   username: someone
#   password: sillyness
#   email: someone@host.com


replicaCount: 1

service:
  type: ClusterIP
  port: 3100

# A TCP check: it keeps working when API authentication is on. With
# GIGAPIPE_LOGIN and GIGAPIPE_PASSWORD set, every HTTP path, /metrics and
# /ready included, answers 401 without credentials, so an httpGet probe would
# fail and restart the pod.
livenessProbe:
  tcpSocket:
    port: http
  initialDelaySeconds: 10 # seconds
  periodSeconds: 10 # seconds
# Any probe type is accepted. /ready checks the ClickHouse connection.
# Without API authentication:
#   httpGet:
#     path: /ready
#     port: http
# With API authentication, an exec probe sends the credentials from the
# container's own environment, so they never appear in the pod spec:
#   exec:
#     command:
#       - /bin/sh
#       - -c
#       - >-
#         wget -q -O /dev/null -T 4
#         --header "Authorization: Basic $(printf '%s:%s' "$GIGAPIPE_LOGIN" "$GIGAPIPE_PASSWORD" | base64 | tr -d '\n')"
#         http://127.0.0.1:3100/ready
readinessProbe: {}

podAnnotations: {}
podLabels: {}

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

serviceMonitor:
  enabled: false
  interval: "30s"
  annotations: {}

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: false
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podSecurityContext: {}
# Meets the Pod Security "restricted" profile.
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000
  seccompProfile:
    type: RuntimeDefault

ingress:
  enabled: false
  className: ""
  annotations: {}
    #   kubernetes.io/ingress.class: nginx
    #   nginx.ingress.kubernetes.io/force-ssl-redirect: 'true'
    #   nginx.ingress.kubernetes.io/auth-type: basic
    #   nginx.ingress.kubernetes.io/auth-secret: basic-auth
    #   nginx.ingress.kubernetes.io/auth-realm: 'Authentication Required'
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local
basicAuthPass: ""
  # APR1-MD5 format required for nginx basic auth
  # example user test, pass test 
  # "test:$apr1$vbY9pP6j$GruYGP/AoYR1RPQN8KshE."

# ClickHouse credentials from an existing Secret (used when env.CLICKHOUSE_AUTH
# is not set). Either one key holding user:password:
# auth:
#   clickhouse:
#     existingSecret: some-secret
#     authKey: CLICKHOUSE_AUTH        # default
# kubectl create secret generic some-secret --from-literal=CLICKHOUSE_AUTH='default:userpassword' -n yournamespace
#
# or separate user and password keys, composed into CLICKHOUSE_AUTH:
# auth:
#   clickhouse:
#     existingSecret: some-secret
#     userKey: username               # default
#     passwordKey: password           # setting it selects this form
# kubectl create secret generic some-secret --from-literal=username=default --from-literal=password='userpassword' -n yournamespace

# This envs is used to control gigapipe parameters https://gigapipe.com/docs/config.html#parameters.
env: {}
# CLICKHOUSE_SERVER: localhost #Clickhouse Server address
# CLICKHOUSE_PORT: "9000" #Clickhouse Server port (binary)
# CLICKHOUSE_DB: gigapipe #Clickhouse Database Name
# CLICKHOUSE_AUTH: default #Clickhouse Authentication (user:password)
# CLICKHOUSE_PROTO: tcp #Clickhouse Protocol (tcp, tls)
# CLICKHOUSE_TIMEFIELD: record_datetime #Clickhouse DateTime column for native queries
# CLUSTER_NAME: undefined #Clickhouse Cluster name
# STORAGE_POLICY: undefined #Clickhouse Cluster storage policy
# BULK_MAXAGE: "2000" #Max Age for Bulk Inserts
# BULK_MAXSIZE: "5000" #Max Size for Bulk Inserts
# BULK_MAXCACHE: 50000 #Max Labels in Memory Cache
# LABELS_DAYS: 7 #Max Days before Label rotation
# SAMPLES_DAYS: 7 #Max Days before Timeseries rotation
# MODE: all #all, writer, reader, init_only (init db and exit)

envRenderSecret: {}

# Extra environment variables as full EnvVar objects, rendered after env and
# the ClickHouse credentials, so they can use valueFrom and refer to earlier
# variables with $(NAME). For example, the API login password from a Secret:
# extraEnv:
#   - name: GIGAPIPE_LOGIN
#     value: admin
#   - name: GIGAPIPE_PASSWORD
#     valueFrom:
#       secretKeyRef:
#         name: gigapipe-api
#         key: password
extraEnv: []

# Extra envFrom sources (whole Secrets or ConfigMaps), for example:
# envFrom:
#   - secretRef:
#       name: gigapipe-extra-env
envFrom: []
# Example:
# KEY1: "value1"
# Additional volumes on the output Deployment definition.
# Additional volumes on the output Deployment definition.

volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true


nodeSelector: {}

tolerations: []

affinity: {}
